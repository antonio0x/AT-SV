schema: spec-driven

context: |
  Monorepo for Asistente Tributario SV.
  Frontend: React 19 + TypeScript 6 + Vite 8 + Vitest 4 + Tailwind CSS 4 + ESLint 10.
  Backend (planned): Python 3.12+ / FastAPI / DynamoDB (boto3) / Pytest / Ruff / Black / MyPy.
  Architecture: SPA frontend talks to REST API backend; no SSR; deploy as static assets + API behind reverse proxy.

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: true
    test_command: "npm run test"
  verify:
    test_command: "npm run test"
    build_command: "npm run build"
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  detected: 2026-06-11
  runner:
    command: "npm run test"
    framework: vitest
  layers:
    unit:
      available: true
      tool: vitest
    integration:
      available: true
      tool: "@testing-library/react"
    e2e:
      available: false
      tool: pending
  coverage:
    available: true
    command: "npx vitest --coverage"
  quality:
    linter:
      available: true
      command: "npm run lint"
    type_checker:
      available: true
      command: "npx tsc --noEmit"
    formatter:
      available: false
      command: pending
